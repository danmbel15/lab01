name: Github Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions :D
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
        - run: echo "!! The job was automatically triggered by a ${{ github.event_name }} event."
        - run: echo "! This job is now running on a ${{ runner.os }} server hosted by GitHub!"
        - run: echo "The name of your branch is ${{ github.ref }} and your repository name is ${{ github.repository }}."
        - name: Check out repository code
          uses: actions/checkout@v6
        - run: echo "The ${{ github.repository }} repository has been successfully cloned to the runner."
        - run: echo "The workflow is now ready to test your code on the runner."
        - name: List files in the repository
          run: |
            echo "The following files are present in the repository:"
            ls ${{ github.workspace }}
        - run: echo "!! This job's status is ${{ job.status }}"
